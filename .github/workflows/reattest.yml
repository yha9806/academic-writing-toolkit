# Scheduled re-attestation of the pinned-harness compatibility baseline
# (P3 spec item 2, eco #5; parent spec §2.2). Re-runs every gate COMPAT.json
# names against the pinned @deepseek-ai/dsh@0.1.0-rc.6. A red run IS the
# report — this workflow never edits COMPAT.json or any claim; refreshing
# lastVerified stays a human commit.
name: reattest

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch: {}

jobs:
  reattest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guards suite (testkit tier, pin probes, refold, ask-seam, bundle contract)
        run: |
          cd guards
          npm ci --no-audit --no-fund
          npm test
      - name: Live headless e2e denial table
        run: |
          cd e2e
          npm ci --no-audit --no-fund
          node run-e2e.mjs
      - name: Credential probe (typed MISSING_CREDENTIAL, keyless)
        run: |
          cd e2e
          node run-credential-probe.mjs
      - name: Skill-scope probe (workspace catalogue only, keyless)
        run: |
          cd e2e
          node run-skill-scope-probe.mjs
      - name: E1 offline instrument (synthetic E0 evidence only)
        run: node e1/run-e1.mjs
      - name: Pack-and-install smoke
        run: node guards/scripts/pack-smoke.mjs
