name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Three jobs, not one: they cover different things. windows-runtime runs the
  # native setup and the Node tests on Windows, where they have already found
  # defects the Linux legs structurally cannot see (junctions, path spelling).
  # global-skills exercises the installer's own matrix. test is the Linux
  # regression suite.
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up a fresh native Windows checkout without preinstalled export dependencies
        run: node scripts/setup.mjs
      - name: Check native skill links and the actual export backend
        run: |
          node scripts/setup.mjs doctor
          git diff --exit-code
      - name: Catalogue truth, the notes contract, the fidelity audit and the workspace scaffold
        run: node --test scripts/test-catalogue.mjs scripts/test-notes-lint.mjs scripts/test-citation-fidelity.mjs scripts/test-scaffold.mjs
  global-skills:
    name: Global skills (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: macos-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test native clean setup and safe link repair on every platform
        run: node --test scripts/test-native-setup.mjs
      - run: python -m pip install -r scripts/codex-skills-requirements.txt
      - name: Test isolated installs, updates, collisions, rollback and real helpers
        run: python scripts/test-codex-skills.py
      - name: Install with a fresh private runtime
        run: python scripts/install-codex-skills.py --dest "${{ runner.temp }}/awt-user/skills" --install-deps
      - name: Repeat installation and verify the published receipt
        run: |
          python scripts/install-codex-skills.py --dest "${{ runner.temp }}/awt-user/skills" --install-deps
          python scripts/install-codex-skills.py --dest "${{ runner.temp }}/awt-user/skills" --verify
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
      - name: Verify python3.8 binary on PATH
        run: python3.8 --version
      - name: Install conversion backend (T17 smoke-import dependency)
        run: pip install -r .claude/skills/export/scripts/requirements.txt
      - name: Install pandoc (system binary; make doctor probes for it)
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Configure git core.fileMode false (make doctor expects this)
        run: git config core.fileMode false
      - run: make doctor
      - name: Regression suite, including validators of bundles retired under archive/skills/
        run: make test-all
      - name: Catalogue truth, the notes contract, the fidelity audit and the workspace scaffold
        run: node --test scripts/test-catalogue.mjs scripts/test-notes-lint.mjs scripts/test-citation-fidelity.mjs scripts/test-scaffold.mjs
