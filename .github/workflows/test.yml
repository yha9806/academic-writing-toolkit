name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two jobs, not one: they cover different things. windows-runtime is the only
  # leg that runs the guards suite and the live probes on Windows, and it has
  # already found three defects the Linux legs structurally cannot see.
  # global-skills exercises the installer's own matrix.
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up a fresh native Windows checkout without preinstalled export dependencies
        run: node scripts/setup.mjs
      - name: Check native skill links and the actual export backend
        run: |
          node scripts/setup.mjs doctor
          git diff --exit-code
      - run: npm ci --prefix guards
      - run: npm test --prefix guards
      - run: npm ci --prefix e2e
      - run: node e2e/run-e2e.mjs
      - run: node e2e/run-credential-probe.mjs
      - run: node e2e/run-skill-scope-probe.mjs
      - run: node e1/run-e1.mjs
  global-skills:
    name: Global skills (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: macos-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test native clean setup and safe link repair on every platform
        run: node --test scripts/test-native-setup.mjs
      - run: npm ci --prefix guards
      - run: python -m pip install -r scripts/codex-skills-requirements.txt
      - name: Test isolated installs, updates, collisions, rollback and real helpers
        run: python scripts/test-codex-skills.py
      - name: Install with a fresh private runtime
        run: python scripts/install-codex-skills.py --dest "${{ runner.temp }}/awt-user/skills" --install-deps
      - name: Repeat installation and verify the published receipt
        run: |
          python scripts/install-codex-skills.py --dest "${{ runner.temp }}/awt-user/skills" --install-deps
          python scripts/install-codex-skills.py --dest "${{ runner.temp }}/awt-user/skills" --verify
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
      - name: Verify python3.8 binary on PATH
        run: python3.8 --version
      - name: Install conversion backend (T17 smoke-import dependency)
        run: pip install -r .claude/skills/export/scripts/requirements.txt
      - name: Install pandoc (system binary; make doctor probes for it)
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Configure git core.fileMode false (make doctor expects this)
        run: git config core.fileMode false
      - run: make doctor
      - run: make test
      - name: Guards package tests (notes lint + catalogue truth tests)
        run: npm --prefix guards ci && npm --prefix guards test
