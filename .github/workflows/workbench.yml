name: optional-workbench

on:
  push:
    branches: [main, codex/workbench-proposal]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
            documents: false
          - os: ubuntu-latest
            python: '3.11'
            documents: false
          - os: macos-latest
            python: '3.11'
            documents: false
          - os: ubuntu-latest
            python: '3.11'
            documents: false
            tokenizer: true
          - os: ubuntu-latest
            python: '3.11'
            documents: true
          - os: windows-latest
            python: '3.11'
            documents: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - if: matrix.documents
        run: python -m pip install -e ".[documents]" reportlab
      - if: matrix.tokenizer
        run: python -m pip install tiktoken
      - name: Record optional dependency paths
        run: python -c "import sys, importlib.util; print(sys.version); print({name: bool(importlib.util.find_spec(name)) for name in ('tiktoken', 'pypdf', 'pypdfium2', 'PIL')})"
      - run: python -B -m unittest discover -s tests/runtime -p 'test_*.py'
      - run: node --check awt/review_project.js
      - run: node --check awt/submission.js
      - if: runner.os == 'Linux' && matrix.python == '3.9'
        run: bash scripts/check-mvp-install.sh
