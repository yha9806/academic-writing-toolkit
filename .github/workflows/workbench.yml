name: optional-workbench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
            documents: false
          - os: ubuntu-latest
            python: '3.11'
            documents: true
          - os: windows-latest
            python: '3.11'
            documents: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - if: matrix.documents
        run: python -m pip install -e ".[documents]" reportlab
      - run: python -B -m unittest discover -s tests/runtime -p 'test_*.py'
      - run: node --check awt/review_project.js
      - run: node --check awt/submission.js
      - if: runner.os == 'Linux' && !matrix.documents
        run: bash scripts/check-mvp-install.sh
